<form>
    <div mat-dialog-content class="content my-class">
    <div class="app-dialog-title" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
      <h4 class="modal-title" id="modal-basic-title" style="width:90%;"> Details</h4>  
      <button type="button" class="close" aria-label="Close"  (click)="closepage()">  
        <span aria-hidden="true">x</span>  
      </button>  
    </div>  
     <div class="app-dialog-panel"> 
    <div>
      <label class="col-sm-4 col-form-label">{{nameshare}}</label>    
    </div>
    <table class="app-table-rows-15" mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="srno">
        <th mat-header-cell *matHeaderCellDef>S.N.</th>
        <td mat-cell *matCellDef="let element; let i = index;"  style="width:50px;"> {{ i + 1 }} </td>
    </ng-container>
      <ng-container matColumnDef="fy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> FY </th>
        <td mat-cell *matCellDef="let element" style="width:120px;"> {{element.fy}} </td>
      </ng-container> 
       <ng-container matColumnDef="depositeamt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Dep. Amt </th>
          <td mat-cell *matCellDef="let element" > {{element.depositeamt}} </td>
        </ng-container>
        <ng-container matColumnDef="amt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Int. Amt </th>
          <td mat-cell *matCellDef="let element"
          > {{element.amt}} </td>
        </ng-container>
       
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
     
  </div>
  <div></div></div>
  </form>
