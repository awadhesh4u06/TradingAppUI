<div class="mb-4 row"> 
  <label class="col-sm-1"> Sort by: </label>
  <div class="col-sm-2">     
    <select class="form-control" id="ddlsortcolm" name="ddlsortcolm" (change) ="LoadSortData()"> 
      <option value="Sector">Sector</option> 
      <option value="RealPL">RealPL</option> 
      <option value="divident">Divident</option>
      <option value="Real_Div">Real+Div</option>
      <option value="OP">OP</option>
      <option value="OP_Div">OP+Div</option>
      <option value="ProfitPer">Profit %</option>
      <option value="ProPer_Div">Pro+Div%</option>
    </select>
  </div>
     <div class="col-sm-2"> 
    <select class="form-control" id="ddldir" name="ddldir"  (change) ="LoadSortData()"> 
      <option value="DESC">Desc</option> 
       <option value="Asc">Asc</option> 
      
    </select>
  </div>
</div>
<div class="chart-container"> 
    <canvas  id="_MyChart" >{{ chart }}</canvas>
</div>

<div>
     
      <div style="align-items: center;">
        <table class="app-table-standard app-table-hover" mat-table [dataSource]="dataSource" matSort>
      
             
          <ng-container matColumnDef="sector">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Sector </th>
            <td mat-cell *matCellDef="let element"> 
             <label>{{element.sector}}</label>
            </td>
          </ng-container>
          <!-- sector Column -->
          <ng-container matColumnDef="realPL">
            <th mat-header-cell *matHeaderCellDef  mat-sort-header> Real PL</th>
            <td mat-cell *matCellDef="let element">
               {{element.realPL}} </td>     
          </ng-container>
          <ng-container matColumnDef="divident">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Div </th>
            <td mat-cell *matCellDef="let element"> {{element.divident}} </td>
          </ng-container> 
          <ng-container matColumnDef="real_Div">
            <th mat-header-cell *matHeaderCellDef  mat-sort-header> Real Div </th>
            <td mat-cell *matCellDef="let element">
               {{element.real_Div}} </td>     
          </ng-container>
          <ng-container matColumnDef="op">
            <th mat-header-cell *matHeaderCellDef  mat-sort-header> Op</th>
            <td mat-cell *matCellDef="let element">
               {{element.op}} </td>     
          </ng-container>
       <ng-container matColumnDef="oP_Div">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> OP_Div </th>
        <td mat-cell *matCellDef="let element"> {{element.oP_Div}} </td>
      </ng-container>    
      <ng-container matColumnDef="profitPer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Profit% </th>
        <td mat-cell *matCellDef="let element"> {{element.profitPer}} </td>
      </ng-container>  
      <ng-container matColumnDef="proPer_Div">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Pro_Div% </th>
        <td mat-cell *matCellDef="let element"> {{element.proPer_Div}} </td>
      </ng-container>  
      <ng-container matColumnDef="bclr">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Color </th>
        <td mat-cell *matCellDef="let element"> {{element.bclr}} </td>
      </ng-container>  
    
          <tr mat-header-row *matHeaderRowDef="displayedColumns" ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table> 
        <mat-paginator length="100" #paginator [pageSizeOptions]="[25,35,45,55,80]"
                       showFirstLastButtons
                       aria-label="Select page">
        </mat-paginator>
      </div>
