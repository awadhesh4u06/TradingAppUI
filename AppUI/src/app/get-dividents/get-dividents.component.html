<div mat-dialog-content class="content my-class">
  <div class="app-dialog-title" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
      <h4 class="modal-title" id="modal-basic-title" style="width: 97%;">Dividents Details</h4>
      <button type="button" class="close" aria-label="Close" style="float: right; display: inline-grid;font-stretch: extra-expanded;
    float: right;
    padding-left: 2px;" (click)="closepage()">
        <span aria-hidden="true">x</span>
      </button>
    </div>
   <div class="app-dialog-panel"> 
  <div>
  <label class="col-sm-4 col-form-label" style="padding-left: 20px; width: auto; padding-right: 1%;">{{nameshare}} :  {{printtot}}</label>  
  <label class="myBtn" (click)="ShowGraph(nameshare)" style="float:right; margin-right:10px;">Graph</label> 
  </div>
  <table class="app-table-rows-15" mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="srno">
      <th mat-header-cell *matHeaderCellDef>S.N.</th>
      <td mat-cell *matCellDef="let element; let i = index;"  style="width:50px;"> {{ i + 1 }} </td>
  </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let element" style="width:125px;"> {{element.name}} </td>
    </ng-container>
    <ng-container matColumnDef="depositeDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
        <td mat-cell *matCellDef="let element"   style="width:120px;"> {{element.depositeDate }} 
          
        </td>
      </ng-container>
    <ng-container matColumnDef="nos">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>  Nos </th>
        <td mat-cell *matCellDef="let element"
         style="width:50px;" > {{element.nos}} </td>
      </ng-container>
      <ng-container matColumnDef="divpershare">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Div/Share </th>
        <td mat-cell *matCellDef="let element"
         style="width: 50px;" > {{element.divpershare}} </td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
        <td mat-cell *matCellDef="let element"
         style="width:50px;" > {{element.amount}} </td>
      </ng-container> 
      <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>  </th>
            <td mat-cell *matCellDef="let element"  [matTooltip]="element.userName"
             style="width: 40px !important;" class="{{element.clsName}}" >{{element.intialname}} </td>
          </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table> 
</div>
<div></div></div>
