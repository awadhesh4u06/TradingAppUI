<form [formGroup]="frmbst" #forms="ngForm" style="text-align: -webkit-center;" (ngSubmit)="SaveDataVal()">
     
     <div class="app-dialog-panel">  
    <div class="mb-4 row"> 
      <label class="col-sm-2 col-form-label">Name :</label>
      <div class="col-sm-5">     
        <select class="form-control" id="ddlsymbol" name="ddlsymbol"> 
          <option value="0">--Select--</option> 
        <option *ngFor="let options of _symbolList" 
        [value]="options.id" 
        [selected]="options.name === nameshare">
        {{options.name}}</option></select> 
      </div>
    </div>
    <div class="mb-4 row" [hidden]="true">
        <label class="col-sm-2 col-form-label">Isin :</label>
        <div class="col-sm-5">          
          <input type="text" name="isin" value="{{frmbst.controls['isin']}}"   formControlName="isin"            
          class="form-control" />
        </div>
      </div>
  
      <div class="mb-4 row">
        <label class="col-sm-2 col-form-label">TradeId :</label>
        <div class="col-sm-5">          
          <input type="text" name="tradeid" value="{{frmbst.controls['tradeid']}}"   formControlName="tradeid"            
          class="form-control" />
        </div>
      </div>
    <div class="mb-4 row">
      <label class="col-sm-2 col-form-label">Date :</label>
      <div class="col-sm-5" >
      <input type="date" name="tradedate" formControlName="tradedate" [ngModel]="currentStringDate"
       (change)="processChange($event)" class="form-control" id="tradedate"/>
    </div></div>
    <div class="mb-4 row"> <label class="col-sm-2 col-form-label">Exchange :</label>
        <div class="col-sm-5"> 
        <mat-radio-group aria-label="Exchange" name="exchange"  formControlName="exchange" 
        class="form-control" id="exchange" style="text-align: left;"> 
            <mat-radio-button value="BSE">BSE</mat-radio-button>
            <mat-radio-button value="NSE">NSE</mat-radio-button>
          </mat-radio-group>
    </div></div>

    <div class="mb-4 row"> <label class="col-sm-2 col-form-label">Type :</label>
        <div class="col-sm-5"> 
        <mat-radio-group aria-label="Trade Type" name="ttype" formControlName="ttype" 
        class="form-control" style="text-align: left;" id="ttype">
            <mat-radio-button value="Buy" checked={{buytrue}} >Buy</mat-radio-button>
            <mat-radio-button value="Sell" checked={{selltrue}} >Sell</mat-radio-button>
          </mat-radio-group>
    </div></div>
      <div class="mb-4 row"> <label class="col-sm-2 col-form-label">IPO :</label>
        <div class="col-sm-5"> 
        <mat-radio-group aria-label="IPO" name="isipo" formControlName="isipo" 
        class="form-control" style="text-align: left;" id="isipo">
            <mat-radio-button value="0" checked={{Notrue}} >No</mat-radio-button>
            <mat-radio-button value="1">Yes</mat-radio-button>
          </mat-radio-group>
    </div></div>
    <div class="mb-4 row">
      <label  class="col-sm-2 col-form-label">Quantity :</label> 
       <div class="col-sm-5">  
      <input type="number" name="qty" value="0"  formControlName="qty"   class="form-control" id="qty" />
      </div></div>
    <div class="mb-4 row">
      <label  class="col-sm-2 col-form-label">Price :</label>
      <div class="col-sm-5"> 
      <input type="number" name="price" class="form-control" formControlName="price" />
      </div></div>

      <div class="mb-4 row">
        <label  class="col-sm-2 col-form-label">Brokerage :</label>
        <div class="col-sm-5"> 
        <input type="number" name="brokerage" class="form-control" formControlName="brokerage" />
        </div></div>
        <div class="mb-4 row" style="text-align: center">
            <div class="col-sm-5"> 
            <button type="button" style="width: 25%;" (click)="SaveDataVal()" 
            class="btn btn-primary">Update</button>
        </div>
    </div>
  </div>
    </form>
