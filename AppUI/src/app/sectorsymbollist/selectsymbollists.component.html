<main class="symbol-page">
  <header class="page-header">
    <div> 
      <h1>Sector symbols</h1>
      </div>
    <button (click)="opendailogadd()" class="new-symbol-button" type="button">
      <span aria-hidden="true">+</span>
      New symbol
    </button>
  </header>

  <section class="symbol-panel" aria-labelledby="symbol-list-title">
    <div class="panel-toolbar">
     <!--  <div>
        <h2 id="symbol-list-title">Symbol directory</h2>  
        <p>Search by symbol name, sector, or identifier.</p>
      </div> -->
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Search symbols</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="e.g. technology" #input>
      </mat-form-field>
    </div>

    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" matSort>
    <!-- Id Column -->
    <ng-container matColumnDef="srno">
      <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
      <td mat-cell *matCellDef="let element; let i = index;"> {{ i + 1 }} </td>
  </ng-container>
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear >  Id</th>
        <td mat-cell *matCellDef="let element" > {{element.id}} </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
  
      <!-- sector Column -->
      <ng-container matColumnDef="sector">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header> Sector </th>
        <td mat-cell *matCellDef="let element"  > {{element.sector}} </td>
      </ng-container>
    <!-- Div Column -->
    <ng-container matColumnDef="Divident">
      <th mat-header-cell *matHeaderCellDef> Dividend </th>
      <td mat-cell *matCellDef="let element">
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'div')" 
        class="table-action dividend-action" type="button">Div</button>
       </td>
    </ng-container>
    <ng-container matColumnDef="buy">
      <th mat-header-cell *matHeaderCellDef> Buy</th>
      <td mat-cell *matCellDef="let element">
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'buy')" 
        class="table-action buy-action" type="button">Buy</button>
       </td>
    </ng-container>

    <ng-container matColumnDef="sell">
      <th mat-header-cell *matHeaderCellDef>Sell </th>
      <td mat-cell *matCellDef="let element">
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'sell')" 
        class="table-action sell-action" type="button">Sell</button>
       </td>
    </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator #paginator [pageSizeOptions]="[10, 15, 20, 30]"
                   showFirstLastButtons
                   aria-label="Select page">
    </mat-paginator>
  </section>
</main>
