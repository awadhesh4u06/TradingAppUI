<button (click)="opendailogadd()" class="btn btn-success">New Symbol</button>
              
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Seach Data" #input>
</mat-form-field>
<div class="mat-elevation-z8">
 
    <table mat-table [dataSource]="dataSource" matSort>
    <!-- Id Column -->
    <ng-container matColumnDef="srno">
      <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
      <td mat-cell *matCellDef="let element; let i = index;"> {{ i + 1 }} </td>
  </ng-container>
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear >  Id</th>
        <td mat-cell *matCellDef="let element" > {{element.id}} </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
  
      <!-- sector Column -->
      <ng-container matColumnDef="sector">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header> Sector </th>
        <td mat-cell *matCellDef="let element"  > {{element.sector}} </td>
      </ng-container>
    <!-- Div Column -->
    <ng-container matColumnDef="Divident" >
      <th mat-header-cell *matHeaderCellDef  mat-sort-header> Divident </th>
      <td mat-cell  *matCellDef="let element" > 
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'div')" 
        class="btn btn-success">Div</button>  
       </td>
    </ng-container>
    <ng-container matColumnDef="buy" >
      <th mat-header-cell *matHeaderCellDef  mat-sort-header> Buy</th>
      <td mat-cell  *matCellDef="let element" >  
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'buy')" 
        class="btn btn-success">Buy</button> 
       </td>
    </ng-container>
    
    <ng-container matColumnDef="sell" >
      <th mat-header-cell *matHeaderCellDef  mat-sort-header>Sell </th>
      <td mat-cell  *matCellDef="let element" >  
        <button [attr.data-divdtID]="element.id"  (click)="goToPage(element.id,element.name,'sell')" 
        class="btn btn-success">Sell</button> 
       </td>
    </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class={{row.Name}}></tr>
    </table>
  
    <mat-paginator length="100" #paginator [pageSizeOptions]="[10, 15,20,30]"
                   showFirstLastButtons
                   aria-label="Select page">
    </mat-paginator>
  </div>
