<div class="fy-dialog-title" mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
  <span>Add IC Account</span>
  <button type="button" class="fy-dialog-close" aria-label="Close" (click)="closepage()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<form [formGroup]="masterForm" (ngSubmit)="Save()">
  <div mat-dialog-content class="add-ic-content">

    <div class="row">
      <mat-form-field>
        <mat-label>Bank</mat-label>
        <mat-select formControlName="bank">
          <mat-option *ngFor="let b of banks" [value]="b">{{b}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Ac Type</mat-label>
        <mat-select formControlName="acType">
          <mat-option *ngFor="let t of acTypes" [value]="t">{{t}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Ac No</mat-label>
        <input matInput formControlName="acNo">
      </mat-form-field>

      <mat-form-field *ngIf="isIWish">
        <mat-label>Ac Name</mat-label>
        <input matInput formControlName="acName">
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field>
        <mat-label>RoI</mat-label>
        <input matInput type="number" formControlName="roi">
      </mat-form-field>

      <mat-form-field *ngIf="!isPPF">
        <mat-label>Deposit Amt</mat-label>
        <input matInput type="number" formControlName="depositAmt">
      </mat-form-field>

      <mat-form-field *ngIf="!isPPF">
        <mat-label>Final Amt</mat-label>
        <input matInput type="number" formControlName="finalAmt">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Start Date</mat-label>
        <input matInput type="date" formControlName="startDate">
      </mat-form-field>

      <mat-form-field>
        <mat-label>End Date</mat-label>
        <input matInput type="date" formControlName="endDate">
      </mat-form-field>
    </div>

    <div class="details-header">
      <h4>FY Details</h4>
      <button type="button" mat-stroked-button (click)="addRow()">+ Add Row</button>
    </div>

    <table class="add-ic-table" formArrayName="details">
      <thead>
        <tr>
          <th>FY</th>
          <th>Dep. Amt</th>
          <th *ngIf="isPPF">Int. Amt</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of details.controls; let i = index" [formGroupName]="i">
          <td>
            <select formControlName="fy" class="fy-select">
              <option *ngFor="let f of fyOptions" [value]="f">{{f}}</option>
            </select>
          </td>
          <td *ngIf="!isPPF"><input matInput type="number" formControlName="amt"></td>
          <td *ngIf="isPPF"><input matInput type="number" formControlName="ppfDepositAmt"></td>
          <td *ngIf="isPPF"><input matInput type="number" formControlName="intAmt"></td>
          <td>
            <button type="button" mat-icon-button (click)="removeRow(i)" aria-label="Remove row">&times;</button>
          </td>
        </tr>
        <tr *ngIf="details.length === 0">
          <td [attr.colspan]="isPPF ? 4 : 3" class="empty-row">No FY rows added yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div mat-dialog-actions class="add-ic-actions">
    <button type="button" mat-stroked-button (click)="closepage()">Cancel</button>
    <button type="submit" mat-raised-button color="primary" [disabled]="saving">Save</button>
  </div>
</form>
