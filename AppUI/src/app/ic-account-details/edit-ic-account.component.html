<div class="fy-dialog-title" mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
  <span>Edit Account - {{data.acNo}}</span>
  <button type="button" class="fy-dialog-close" aria-label="Close" (click)="closepage()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<form [formGroup]="editForm" (ngSubmit)="Save()">
  <div mat-dialog-content class="edit-ic-content">
    <div class="row">
      <mat-form-field>
        <mat-label>Start Date</mat-label>
        <input matInput type="date" formControlName="startDate">
      </mat-form-field>

      <mat-form-field>
        <mat-label>End Date</mat-label>
        <input matInput type="date" formControlName="endDate">
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field>
        <mat-label>RoI</mat-label>
        <input matInput type="number" formControlName="roi">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Deposit Amt</mat-label>
        <input matInput type="number" formControlName="depositAmt">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Final Amt</mat-label>
        <input matInput type="number" formControlName="finalAmt">
      </mat-form-field>

    <div class="radio-group-container">
  <label id="is-completed-label">Completed</label>  
        <mat-radio-group 
          aria-labelledby="is-completed-label" 
          formControlName="isCompleted">
          <mat-radio-button [value]="true">Yes</mat-radio-button>
          <mat-radio-button [value]="false">No</mat-radio-button>
        </mat-radio-group>
      </div> 
    </div>
  </div>

  <div mat-dialog-actions class="edit-ic-actions">
    <button type="button" mat-stroked-button (click)="closepage()">Cancel</button>
    <button type="submit" mat-raised-button color="primary" [disabled]="saving">Save</button>
  </div>
</form>
