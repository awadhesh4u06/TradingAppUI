<div style="padding-left: 10px;padding-right: 10px;">
    <table class="app-table-standard" mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="fYear">
            <th mat-header-cell *matHeaderCellDef  mat-sort-header> Fin-Year</th>
            <td mat-cell *matCellDef="let element">
               {{element.fYear}} </td>   
                 <td mat-footer-cell *matFooterCellDef> Total </td>
          </ng-container>
      <ng-container matColumnDef="pl">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>PL </th>       
        <td mat-cell *matCellDef="let element"  class="divd"> 
          <label (click)="ShowPLDetails(element.fYear,element.pl)">{{element.pl}}
          </label>
        </td>
         <td mat-footer-cell *matFooterCellDef> {{printPL}} </td>  
      </ng-container> 
      <ng-container matColumnDef="divdt">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header> Div</th>        
           <td mat-cell *matCellDef="let element"  class="divd"> 
            <label (click)="ShowDivDetails(element.fYear,element.divdt)">{{element.divdt}}
            </label>
          </td>      <td mat-footer-cell *matFooterCellDef> {{printDv}} </td> 
      </ng-container>

      <ng-container matColumnDef="brok">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header>Brok</th>
        <td mat-cell *matCellDef="let element">
           {{element.brok}} </td>       <td mat-footer-cell *matFooterCellDef> {{printBr}} </td> 
      </ng-container>
      <ng-container matColumnDef="dp">
        <th mat-header-cell *matHeaderCellDef  mat-sort-header> DP</th>
        <td mat-cell *matCellDef="let element">
           {{element.dp}} </td>    <td mat-footer-cell *matFooterCellDef> {{printDP}} </td>    
      </ng-container>
   <ng-container matColumnDef="amc">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Amc </th>
    <td mat-cell *matCellDef="let element"> {{element.amc}} </td>
      <td mat-footer-cell *matFooterCellDef> {{printAmc}} </td> 
  </ng-container>   
  <ng-container matColumnDef="final">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Final </th>
    <td mat-cell *matCellDef="let element"> {{element.final}} </td>
      <td mat-footer-cell *matFooterCellDef> {{printF}} </td> 
  </ng-container>  
  <ng-container matColumnDef="per">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Per% </th>
    <td mat-cell *matCellDef="let element"> {{element.percentage}} </td>
      <td mat-footer-cell *matFooterCellDef> {{printP}} </td> 
  </ng-container>      
      <tr mat-header-row *matHeaderRowDef="displayedColumns;" ></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
     <!-- <tr mat-footer-row *matFooterRowDef="displayedColumns" class="example-first-footer-row"></tr>
       <tr mat-footer-row *matFooterRowDef="['fYear']" class="example-second-footer-row"></tr> -->
    </table> 
    <mat-paginator length="100" #paginator [pageSizeOptions]="[20,30,40,60,80,100]"
                   showFirstLastButtons
                   aria-label="Select page">
    </mat-paginator>
  </div>
