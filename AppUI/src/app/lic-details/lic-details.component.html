<form>
    <div mat-dialog-content class="content my-class">
    <div class="app-dialog-title" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
      <h4 class="modal-title" id="modal-basic-title" style="width: 621px;">LIC Details</h4>  
      <button type="button" class="close" aria-label="Close"  (click)="closepage()">  
        <span aria-hidden="true">x</span>  
      </button>  
    </div>  
     <div class="app-dialog-panel"> 
    <div>
      <label class="col-form-label">{{namepolicy}}</label>    
    </div>
    <table class="app-table-rows-15 app-table-hover" mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="srno">
        <th mat-header-cell *matHeaderCellDef>S.N.</th>
        <td mat-cell *matCellDef="let element; let i = index;"  style="width:50px;"> {{ i + 1 }} </td>
    </ng-container>
     
      <ng-container matColumnDef="paymentDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
          <td mat-cell *matCellDef="let element"> {{element.paymentDate }}             
          </td>
        </ng-container>
      <ng-container matColumnDef="amtwithGST">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>  Amount </th>
          <td mat-cell *matCellDef="let element"> {{element.amtwithGST}} </td>
        </ng-container>
        <ng-container matColumnDef="casebackAmt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> CashBack </th>
          <td mat-cell *matCellDef="let element"> {{element.casebackAmt}} </td>
        </ng-container>
        <ng-container matColumnDef="amtRd">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> RD Amt </th>
          <td mat-cell *matCellDef="let element"> {{element.amtRd}} </td>
        </ng-container>
        <ng-container matColumnDef="rD_ACNO">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> RD A/C </th>
            <td mat-cell *matCellDef="let element"> {{element.rD_ACNO}} </td>
          </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <!-- <mat-paginator length="100" #paginator [pageSizeOptions]="[25,30,40,60,80]"
                     showFirstLastButtons
                     aria-label="Select page">
      </mat-paginator> -->
  </div>
  <div></div></div>
  </form>
