  <form >
    <div mat-dialog-content class="content my-class app-dialog-surface">
    <div class="app-dialog-title" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
      <h4 class="modal-title" id="modal-basic-title" style="width:93%">Dividents Details</h4>
      <button type="button" class="app-dialog-close" aria-label="Close"  (click)="closepage()">
        <span aria-hidden="true">x</span>  
      </button>  
    </div>  
     <div class="app-dialog-panel"> 
    <div>
      <label class="col-form-label">{{fyear}} :  {{printtot}}</label>     &nbsp;&nbsp;
      <label  class="myBtn" (click)="opendata('myModall')"> Sector-Wise</label> 
       <label class="myBtn" (click)="ShowGraph(fyear)" style="float:right; margin-right:10px;">Graph</label> 
    </div>
    <div id="myModal" class="modal app-sector-overlay" [ngClass]="{cssClass1: activeClass, cssClass2: !activeClass}" (click)="$event.stopPropagation()">

      <!-- Modal content -->
      <div class="modal-content" cdkDrag>
      <div cdkDragHandle class="inner-modal-drag-header">
        <span class="inner-modal-drag-title">{{fyear}}
        <mat-icon class="inner-modal-drag-icon app-dialog-icon">drag_indicator</mat-icon>
       </span> 
      <button type="button" class="close" aria-label="Close sector details"
        (pointerdown)="$event.stopPropagation()" (click)="closepop()">&times;</button>
      </div>
 <table class="app-table-rows-15 app-table-hover" mat-table #sortCol1="matSort" [dataSource]="dataSource2" matSort   matSortDirection="asc">
  <ng-container matColumnDef="srno">
    <th mat-header-cell *matHeaderCellDef>S.N.</th>
    <td mat-cell *matCellDef="let element; let i = index;"  style="width:50px;"> {{ i + 1 }} </td>
</ng-container>
  <ng-container matColumnDef="sector">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Sector </th>
    <td mat-cell *matCellDef="let element"> {{element.sector}} </td>
  </ng-container>
  
  
    <ng-container matColumnDef="divident">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount </th>
        <td mat-cell *matCellDef="let element"> {{element.divident}} </td>
      </ng-container>    
     
  <tr mat-header-row *matHeaderRowDef="disColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: disColumns;"></tr> </table> 

 
</div><br/><br/></div>

    <table class="app-table-rows-15 app-table-hover" mat-table [dataSource]="dataSource"  #sortCol2="matSort" [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="srno">
        <th mat-header-cell *matHeaderCellDef>S.N.</th>
        <td mat-cell *matCellDef="let element; let i = index;"  style="width:50px;"> {{ i + 1 }} </td>
    </ng-container>
      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element" style="width:125px;"> {{element.symbol}} </td>
      </ng-container>
      <ng-container matColumnDef="sector">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Sector </th>
        <td mat-cell *matCellDef="let element"> {{element.sector}} </td>
      </ng-container>
    
        <ng-container matColumnDef="divident">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
          <td mat-cell *matCellDef="let element"> {{element.divident}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
  </div>
  <div></div></div>
  </form>
